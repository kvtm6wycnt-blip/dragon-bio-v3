<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听鼓而动，闻锣而息 — 龙舟赛生物作业交互空间</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a1628;color:#e8e8e8;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);}
::-webkit-scrollbar-thumb{background:rgba(212,168,83,0.4);border-radius:3px;}

/* ===== HERO ===== */
#hero{position:fixed;top:0;left:0;width:100%;height:100vh;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 0.8s ease,transform 0.8s ease;}
#hero.hidden{opacity:0;pointer-events:none;transform:scale(1.05);}
#hero-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:url('https://cdn.jsdelivr.net/gh/kvtm6wycnt-blip/dragon-bio-homework@main/images/dragon_landscape_bg.jpg') center/cover no-repeat;animation:heroBgZoom 30s ease-in-out infinite alternate;}
@keyframes heroBgZoom{0%{transform:scale(1);}100%{transform:scale(1.08);}}
#hero-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,22,40,0.72);}
#hero-particles{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:rgba(212,168,83,0.5);border-radius:50%;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.hero-content{position:relative;z-index:1;max-width:900px;padding:0 24px;}
.hero-title{font-size:clamp(2.2rem,6vw,4.5rem);font-weight:900;background:linear-gradient(135deg,#f0d078,#d4a853,#c4943e,#f0d078);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;margin-bottom:24px;letter-spacing:0.08em;line-height:1.3;}
.hero-subtitle{font-size:clamp(0.85rem,1.8vw,1.05rem);color:rgba(255,255,255,0.82);line-height:1.9;text-align:left;background:rgba(0,0,0,0.3);padding:24px 28px;border-radius:12px;border:1px solid rgba(212,168,83,0.2);max-height:38vh;overflow-y:auto;margin-bottom:32px;}
.hero-subtitle::-webkit-scrollbar{width:4px;}
.hero-subtitle::-webkit-scrollbar-thumb{background:rgba(212,168,83,0.3);border-radius:2px;}
.hero-btn{display:inline-block;padding:16px 48px;font-size:1.15rem;font-weight:700;color:#0a1628;background:linear-gradient(135deg,#f0d078,#d4a853);border:none;border-radius:50px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 24px rgba(212,168,83,0.35);animation:btnPulse 2s ease-in-out infinite;}
.hero-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(212,168,83,0.5);}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 24px rgba(212,168,83,0.35);}50%{box-shadow:0 4px 36px rgba(212,168,83,0.55);}}

/* ===== NAVBAR ===== */
#navbar{position:fixed;top:0;left:0;width:100%;height:56px;z-index:150;background:rgba(10,22,40,0.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(212,168,83,0.15);display:none;align-items:center;justify-content:center;gap:6px;padding:0 12px;transition:opacity 0.5s;}
#navbar.show{display:flex;}
.nav-btn{padding:8px 18px;font-size:0.88rem;font-weight:600;color:rgba(255,255,255,0.6);background:transparent;border:1px solid transparent;border-radius:24px;cursor:pointer;transition:all 0.3s;white-space:nowrap;}
.nav-btn:hover{color:#f0d078;border-color:rgba(212,168,83,0.3);}
.nav-btn.active{color:#f0d078;background:rgba(212,168,83,0.12);border-color:rgba(212,168,83,0.4);}
.nav-btn.completed{color:#6ecf97;}
.nav-btn.completed::after{content:' ✓';font-size:0.75rem;}

/* ===== SLIDER ===== */
#slider-wrap{position:fixed;top:0;left:0;width:100%;height:100vh;display:none;z-index:100;}
#slider-wrap.show{display:block;}
#slider-container{width:100%;height:100vh;overflow:hidden;}
#slider-track{display:flex;height:100%;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);}
.module-panel{min-width:100vw;width:100vw;height:100vh;overflow-y:auto;overflow-x:hidden;padding:72px 20px 60px;display:flex;flex-direction:column;align-items:center;}

/* ===== QUESTION CARDS ===== */
.card{width:100%;max-width:780px;background:rgba(255,255,255,0.04);border-radius:16px;padding:28px 28px 24px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.06);position:relative;overflow:visible;transition:transform 0.2s;flex-shrink:0;}
.card:hover{transform:translateY(-1px);}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.card.m1::before{background:linear-gradient(180deg,#6ecf97,#3da66a);}
.card.m2::before{background:linear-gradient(180deg,#f0d078,#d4a853);}
.card.m3::before{background:linear-gradient(180deg,#6ea8cf,#3d7fa6);}
.card.m4::before{background:linear-gradient(180deg,#cf6e6e,#a63d3d);}
.module-tag{display:inline-block;padding:3px 12px;font-size:0.75rem;font-weight:600;border-radius:20px;margin-bottom:12px;}
.m1 .module-tag{background:rgba(110,207,151,0.15);color:#6ecf97;}
.m2 .module-tag{background:rgba(240,208,120,0.15);color:#f0d078;}
.m3 .module-tag{background:rgba(110,168,207,0.15);color:#6ea8cf;}
.m4 .module-tag{background:rgba(207,110,110,0.15);color:#cf6e6e;}
.card-title{font-size:1.05rem;font-weight:700;color:#f0e6cc;margin-bottom:10px;line-height:1.6;}
.card-context{font-size:0.9rem;color:rgba(255,255,255,0.7);line-height:1.7;margin-bottom:16px;padding:12px 16px;background:rgba(255,255,255,0.03);border-radius:10px;border-left:3px solid rgba(212,168,83,0.3);}
.card-question{font-size:0.95rem;color:#fff;line-height:1.8;margin-bottom:16px;font-weight:500;}
.card-img{display:block;max-height:220px;width:auto;max-width:100%;margin:0 auto 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.3);object-fit:contain;}

/* Options */
.options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.option-btn{display:flex;align-items:center;padding:12px 16px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:10px;cursor:pointer;transition:all 0.25s;font-size:0.9rem;color:rgba(255,255,255,0.85);line-height:1.5;text-align:left;}
.option-btn:hover{border-color:rgba(212,168,83,0.4);background:rgba(212,168,83,0.06);}
.option-btn.selected{border-color:#d4a853;background:rgba(212,168,83,0.12);color:#f0d078;font-weight:600;}
.option-btn .opt-label{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.08);font-size:0.8rem;font-weight:700;margin-right:12px;flex-shrink:0;transition:all 0.25s;}
.option-btn.selected .opt-label{background:#d4a853;color:#0a1628;}

/* Fill-in */
.fill-group{margin-bottom:14px;}
.fill-label{font-size:0.9rem;color:rgba(255,255,255,0.8);margin-bottom:6px;line-height:1.7;}
.fill-input{background:transparent;border:none;border-bottom:2px solid rgba(212,168,83,0.3);color:#f0d078;font-size:0.95rem;padding:4px 8px;width:120px;text-align:center;outline:none;transition:border-color 0.3s;}
.fill-input:focus{border-bottom-color:#d4a853;}
.fill-input::placeholder{color:rgba(255,255,255,0.2);font-size:0.8rem;}

/* Judgment */
.judge-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.judge-item{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);}
.judge-text{font-size:0.85rem;color:rgba(255,255,255,0.8);flex:1;min-width:200px;line-height:1.5;}
.judge-btns{display:flex;gap:6px;}
.judge-btn{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);background:transparent;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.25s;color:rgba(255,255,255,0.5);}
.judge-btn:hover{border-color:rgba(212,168,83,0.5);}
.judge-btn.selected-true{border-color:#6ecf97;background:rgba(110,207,151,0.15);color:#6ecf97;}
.judge-btn.selected-false{border-color:#cf6e6e;background:rgba(207,110,110,0.15);color:#cf6e6e;}

/* Submit button */
.submit-btn{display:block;width:100%;max-width:780px;padding:14px;font-size:1rem;font-weight:700;color:#0a1628;background:linear-gradient(135deg,#f0d078,#d4a853);border:none;border-radius:12px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 16px rgba(212,168,83,0.25);margin-top:8px;}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,168,83,0.4);}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* Analysis Panel */
.analysis-panel{width:100%;max-width:780px;background:rgba(10,22,40,0.85);backdrop-filter:blur(12px);border-radius:16px;padding:28px;margin:20px auto 0;border:1px solid rgba(212,168,83,0.15);display:none;flex-shrink:0;}
.analysis-panel.show{display:block;animation:fadeSlideUp 0.5s ease;}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.analysis-title{font-size:1.1rem;font-weight:700;color:#f0d078;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.analysis-item{margin-bottom:20px;padding:16px;background:rgba(255,255,255,0.03);border-radius:12px;border-left:3px solid;}
.analysis-item.correct{border-left-color:#6ecf97;}
.analysis-item.wrong{border-left-color:#cf6e6e;}
.analysis-result{font-size:0.9rem;font-weight:600;margin-bottom:8px;}
.analysis-result.correct{color:#6ecf97;}
.analysis-result.wrong{color:#cf6e6e;}
.analysis-detail{font-size:0.88rem;color:rgba(255,255,255,0.75);line-height:1.8;}
.analysis-teacher{font-size:0.88rem;color:rgba(255,255,255,0.8);line-height:1.9;margin-top:16px;padding:16px;background:rgba(212,168,83,0.06);border-radius:10px;border:1px solid rgba(212,168,83,0.15);}
.analysis-teacher::before{content:'👩\u200d🏫 教师点评';display:block;font-weight:700;color:#f0d078;margin-bottom:8px;}

/* Reinforcement Questions */
.reinf-section{margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);}
.reinf-title{font-size:1rem;font-weight:700;color:#6ea8cf;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.reinf-card{background:rgba(110,168,207,0.06);border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid rgba(110,168,207,0.12);}
.reinf-q{font-size:0.9rem;color:rgba(255,255,255,0.9);line-height:1.7;margin-bottom:10px;}
.reinf-options{display:flex;flex-direction:column;gap:6px;}
.reinf-opt{padding:8px 12px;background:rgba(255,255,255,0.04);border-radius:8px;font-size:0.85rem;color:rgba(255,255,255,0.75);cursor:pointer;border:1px solid transparent;transition:all 0.2s;}
.reinf-opt:hover{border-color:rgba(110,168,207,0.3);}
.reinf-opt.selected{border-color:#6ea8cf;background:rgba(110,168,207,0.1);}
.reinf-opt.correct-reveal{border-color:#6ecf97;background:rgba(110,207,151,0.1);color:#6ecf97;}
.reinf-opt.wrong-reveal{border-color:#cf6e6e;background:rgba(207,110,110,0.1);color:#cf6e6e;}
.reinf-answer{font-size:0.82rem;color:rgba(255,255,255,0.6);margin-top:8px;display:none;line-height:1.6;}
.reinf-answer.show{display:block;}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;font-size:0.85rem;font-weight:600;color:#6ea8cf;background:rgba(110,168,207,0.1);border:1px solid rgba(110,168,207,0.2);border-radius:20px;cursor:pointer;transition:all 0.3s;margin-top:8px;}
.refresh-btn:hover{background:rgba(110,168,207,0.18);border-color:rgba(110,168,207,0.4);}

/* Radar Chart */
.radar-section{width:100%;max-width:780px;margin-top:24px;}
.radar-container{background:rgba(255,255,255,0.03);border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,0.06);}
.radar-title{font-size:1rem;font-weight:700;color:#f0d078;margin-bottom:16px;text-align:center;}
#radarChart{max-width:400px;margin:0 auto;}

/* ===== CHATBOT ===== */
#chat-toggle{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#f0d078,#d4a853);border:none;cursor:pointer;font-size:1.5rem;z-index:300;box-shadow:0 4px 20px rgba(212,168,83,0.35);transition:all 0.3s;display:flex;align-items:center;justify-content:center;}
#chat-toggle:hover{transform:scale(1.08);}
#chat-panel{position:fixed;bottom:90px;right:24px;width:360px;height:500px;background:rgba(10,22,40,0.95);backdrop-filter:blur(16px);border-radius:16px;border:1px solid rgba(212,168,83,0.2);z-index:290;display:none;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);overflow:hidden;}
#chat-panel.open{display:flex;animation:fadeSlideUp 0.3s ease;}
.chat-header{padding:14px 18px;background:rgba(212,168,83,0.1);border-bottom:1px solid rgba(212,168,83,0.15);display:flex;align-items:center;justify-content:space-between;}
.chat-header-title{font-size:0.95rem;font-weight:700;color:#f0d078;}
.chat-close{background:none;border:none;color:rgba(255,255,255,0.5);font-size:1.2rem;cursor:pointer;padding:4px;}
.chat-close:hover{color:#fff;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:0.85rem;line-height:1.7;animation:fadeSlideUp 0.3s ease;}
.chat-msg.bot{align-self:flex-start;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.88);border-bottom-left-radius:4px;}
.chat-msg.user{align-self:flex-end;background:rgba(212,168,83,0.15);color:#f0e6cc;border-bottom-right-radius:4px;}
.chat-input-area{padding:12px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;}
.chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:8px 14px;color:#fff;font-size:0.85rem;outline:none;}
.chat-input:focus{border-color:rgba(212,168,83,0.4);}
.chat-input::placeholder{color:rgba(255,255,255,0.25);}
.chat-send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f0d078,#d4a853);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.chat-send:hover{transform:scale(1.05);}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .hero-title{font-size:2rem;}
  .hero-subtitle{font-size:0.82rem;padding:16px;max-height:32vh;}
  .nav-btn{padding:6px 12px;font-size:0.78rem;}
  .module-panel{padding:64px 12px 30px;}
  .card{padding:20px 18px 18px;}
  #chat-panel{width:calc(100vw - 32px);right:16px;bottom:84px;height:420px;}
  #chat-toggle{bottom:16px;right:16px;width:48px;height:48px;font-size:1.2rem;}
  .judge-item{flex-direction:column;align-items:flex-start;}
}
@media(max-width:480px){
  .hero-title{font-size:1.7rem;}
  .nav-btn{padding:5px 9px;font-size:0.72rem;}
  .card-title{font-size:0.95rem;}
  .card-question{font-size:0.88rem;}
}
</style>
</head>
<body>

<!-- ===== HERO SECTION ===== -->
<div id="hero">
  <div id="hero-bg"></div>
  <div id="hero-overlay"></div>
  <div id="hero-particles"></div>
  <div class="hero-content">
    <h1 class="hero-title">听鼓而动，闻锣而息</h1>
    <div class="hero-subtitle">
      <strong>【设计意图】</strong><br><br>
      以龙舟赛为真实情境，学生化身"运动生理分析员"，沿<b>赛前指导→赛中监测→赛后分析→应急处置</b>的赛事时间线，完成呼吸系统核心知识的探究学习。<br><br>
      <b>四层进阶</b>：基础识记→应用分析→评价创造→跨学科融合<br>
      <b>六大考点</b>：呼吸系统组成、膈肌运动、呼吸运动、模型评价、急救应用、胸围差与肺活量<br>
      <b>核心素养</b>：生命观念·科学思维·科学探究·社会责任
    </div>
    <button class="hero-btn" onclick="enterModules()">开始答题 ↓</button>
  </div>
</div>

<!-- ===== NAVBAR ===== -->
<nav id="navbar">
  <button class="nav-btn active" onclick="slideTo(0)">一·赛前指导</button>
  <button class="nav-btn" onclick="slideTo(1)">二·赛中监测</button>
  <button class="nav-btn" onclick="slideTo(2)">三·赛后分析</button>
  <button class="nav-btn" onclick="slideTo(3)">四·应急拓展</button>
  <button class="nav-btn" onclick="slideTo(4)">五·智能分析</button>
  <button class="nav-btn" onclick="slideTo(5)">六·强化训练</button>
</nav>

<!-- ===== SLIDER ===== -->
<div id="slider-wrap">
  <div id="slider-container">
    <div id="slider-track">
      <div class="module-panel" id="panel-0"></div>
      <div class="module-panel" id="panel-1"></div>
      <div class="module-panel" id="panel-2"></div>
      <div class="module-panel" id="panel-3"></div>
      <div class="module-panel" id="panel-4"></div>
      <div class="module-panel" id="panel-5"></div>
    </div>
  </div>
</div>

<!-- ===== CHATBOT ===== -->
<button id="chat-toggle" onclick="toggleChat()">🤖</button>
<div id="chat-panel">
  <div class="chat-header">
    <span class="chat-header-title">🧬 生物学习助手</span>
    <button class="chat-close" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-area">
    <input class="chat-input" id="chat-input" placeholder="问我任何呼吸系统的问题..." onkeydown="if(event.key==='Enter')sendChat()">
    <button class="chat-send" onclick="sendChat()">➤</button>
  </div>
</div>

<script>
// ===== PARTICLES =====
(function(){
  const c=document.getElementById('hero-particles');
  for(let i=0;i<25;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=Math.random()*10+'s';
    p.style.width=p.style.height=(2+Math.random()*3)+'px';
    c.appendChild(p);
  }
})();

// ===== STATE =====
let currentSlide = 0;
let answers = {};
let moduleCompleted = [false,false,false,false,false,false];
const KNOWLEDGE_MAP = {
  q1:'呼吸系统组成',
  q2_1:'膈肌运动与胸廓变化',q2_2:'膈肌运动与胸廓变化',q3:'呼吸运动综合应用',
  q4:'模型比较与评价',
  q5:'海姆立克急救与呼吸道',q6:'呼吸系统组成',
  q7_1:'胸围差与肺活量',q7_2:'膈肌运动与胸廓变化',q7_3:'胸围差与肺活量',q7_4:'胸围差与肺活量',q7_5:'胸围差与肺活量',
  q8_1:'呼吸运动综合应用',q8_2:'呼吸运动综合应用',q8_3:'呼吸运动综合应用',q8_4:'呼吸运动综合应用',q8_5:'呼吸运动综合应用'
};
const DIMS = ['呼吸系统组成','膈肌运动与胸廓变化','呼吸运动综合应用','模型比较与评价','海姆立克急救与呼吸道','胸围差与肺活量'];
const DIM_QUESTIONS = {
  '呼吸系统组成':['q1','q6'],
  '膈肌运动与胸廓变化':['q2_1','q2_2','q7_2'],
  '呼吸运动综合应用':['q3','q8_1','q8_2','q8_3','q8_4','q8_5'],
  '模型比较与评价':['q4'],
  '海姆立克急救与呼吸道':['q5'],

// ===== INTERACTION FUNCTIONS =====
function selectOpt(qid, idx, el){
  const parent = el.parentElement;
  parent.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  answers[qid] = idx;
}

function selectJudge(qid, val, el){
  const parent = el.parentElement;
  parent.querySelectorAll('.judge-btn').forEach(b=>{b.classList.remove('selected-true','selected-false');});
  el.classList.add(val?'selected-true':'selected-false');
  answers[qid] = val;
}

function checkAnswer(qid){
  const qKeys = Object.keys(CORRECT);
  if(qKeys.includes(qid)){
    return answers[qid] === CORRECT[qid];
  }
  if(FILL_CORRECT[qid]){
    const ids = FILL_IDS[qid];
    const correctVals = FILL_CORRECT[qid];
    for(let i=0;i<ids.length;i++){
      const inp = document.getElementById(ids[i]);
      if(!inp) return false;
      const val = inp.value.trim();
      if(!val) return false;
      if(!correctVals[i].includes(val)) return false;
    }
    return true;
  }
  return false;
}

function enterModules(){
  document.getElementById('hero').classList.add('hidden');
  setTimeout(()=>{

    document.getElementById('slider-wrap').classList.add('show');
  },400);
}

function slideTo(idx){
  currentSlide = idx;
  document.getElementById('slider-track').style.transform = `translateX(-${idx*100}vw)`;
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active', i===idx);
  });
}

function submitModule(modIdx){
  // Check answers for this module
  const moduleQuestions = [
    ['q1'],
    ['q2_1','q2_2','q3'],
    ['q4'],
    ['q5','q6','q7_1','q7_2','q7_3','q7_4','q7_5','q8_1','q8_2','q8_3','q8_4','q8_5']
  ];
  const qs = moduleQuestions[modIdx];
  
  // Mark completed
  moduleCompleted[modIdx] = true;
  document.querySelectorAll('.nav-btn')[modIdx].classList.add('completed');

  // Save to localStorage
  localStorage.setItem('龙舟赛作业_answers', JSON.stringify(answers));
  localStorage.setItem('龙舟赛作业_completed', JSON.stringify(moduleCompleted));

  // Auto slide to next (for modules 0-2)
  if(modIdx < 3){
    setTimeout(()=>slideTo(modIdx+1), 800);
  } else {
    // Module 3 completed: Show analysis in module 5
    setTimeout(()=>{
      slideTo(4);
      setTimeout(()=>showCompleteAnalysis(), 500);
    }, 800);
  }
}

function showCompleteAnalysis(){
  const allModuleQuestions = [
    ['q1'],
    ['q2_1','q2_2','q3'],
    ['q4'],
    ['q5','q6','q7_1','q7_2','q7_3','q7_4','q7_5','q8_1','q8_2','q8_3','q8_4','q8_5']
  ];
  const moduleNames = ['模块一·赛前指导','模块二·赛中监测','模块三·赛后分析','模块四·应急与拓展'];
  
  let html = '';
  let hasWrong = false;
  let wrongDims = new Set();

  // Analyze each module
  allModuleQuestions.forEach((qs, modIdx)=>{
    html += `<div style="margin:20px 0 12px;font-size:1rem;font-weight:700;color:#6ea8cf;">📋 ${moduleNames[modIdx]}</div>`;
    
    qs.forEach(qid=>{
      const isCorrect = checkAnswer(qid);
      if(!isCorrect) { hasWrong = true; wrongDims.add(KNOWLEDGE_MAP[qid]); }
      const cls = isCorrect ? 'correct' : 'wrong';
      const icon = isCorrect ? '✅' : '❌';
      const expData = QUESTION_EXPLANATIONS[qid];
      let detail = '';
      if(isCorrect){
        detail = expData.correct;
      } else {
        detail = expData.wrong;
        if(ANSWER_EXP[qid]) detail += '<br><br>📖 ' + ANSWER_EXP[qid];
      }
      html += `<div class="analysis-item ${cls}">
        <div class="analysis-result ${cls}">${icon} ${expData.context}</div>
        <div class="analysis-detail">${detail}</div>
      </div>`;
    });
  });

  // Teacher analysis for wrong dimensions
  if(hasWrong){
    html += '<div class="analysis-teacher">';
    wrongDims.forEach(dim=>{
      html += '<p style="margin-bottom:12px;"><strong>🔍 ' + dim + '：</strong>' + TEACHER_ANALYSIS[dim] + '</p>';
    });
    html += '</div>';
  }

  const panel = document.getElementById('analysis-panel');
  panel.innerHTML = html;
  panel.style.display = 'block';
  panel.classList.add('show');
  
  // Mark module 5 as completed
  moduleCompleted[4] = true;
  document.querySelectorAll('.nav-btn')[4].classList.add('completed');

  // Show radar chart
  const radarSection = document.getElementById('radar-section');
  radarSection.style.display = 'block';
  showRadar();

  // Show goto training button
  const gotoBtn = document.getElementById('goto-training-btn');
  gotoBtn.style.display = 'block';

  // Prepare reinforcement questions for module 6
  prepareReinforcementQuestions(wrongDims, hasWrong);

  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function prepareReinforcementQuestions(wrongDims, hasWrong){
  const reinfPanel = document.getElementById('reinf-panel');
  const noWeaknessTip = document.getElementById('no-weakness-tip');
  
  if(!hasWrong){
    reinfPanel.style.display = 'none';
    noWeaknessTip.style.display = 'block';
    return;
  }
  
  noWeaknessTip.style.display = 'none';
  reinfPanel.style.display = 'block';
  
  let html = '';
  wrongDims.forEach(dim=>{
    const pool = QBANK[dim];
    if(!pool) return;
    const shuffled = [...pool].sort(()=>Math.random()-0.5);
    const picked = shuffled.slice(0,2);
    picked.forEach((item,qi)=>{
      const rid = `reinf-${dim.replace(/\s/g,'')}-${qi}`;
      html += `<div class="reinf-card" id="rc-${rid}">`;
      html += `<div class="reinf-q">${item.q}</div>`;
      if(item.type==='mc'){
        html += `<div class="reinf-options">`;
        item.opts.forEach((o,oi)=>{
          html += `<div class="reinf-opt" onclick="checkReinf('${rid}',${oi},${item.ans},this)">${o}</div>`;
        });
        html += `</div>`;
      } else {
        html += `<div style="font-size:0.82rem;color:rgba(255,255,255,0.5);">💡 填空题，想好后点击查看答案</div>`;
      }
      html += `<div class="reinf-answer" id="ra-${rid}">✅ 正确答案：${item.type==='mc'?['A','B','C','D'][item.ans]:item.ans.join('、')}<br>📖 ${item.exp}</div>`;
      html += `</div>`;
    });
  });
  html += `<button class="refresh-btn" onclick="refreshReinforcement()" style="margin-top:16px;">🔄 换一批新题</button>`;
  
  reinfPanel.innerHTML = html;
}

function refreshReinforcement(){
  // Recalculate wrong dimensions and regenerate questions
  const allModuleQuestions = [
    ['q1'],
    ['q2_1','q2_2','q3'],
    ['q4'],
    ['q5','q6','q7_1','q7_2','q7_3','q7_4','q7_5','q8_1','q8_2','q8_3','q8_4','q8_5']
  ];
  
  let wrongDims = new Set();
  allModuleQuestions.forEach(qs=>{
    qs.forEach(qid=>{
      if(!checkAnswer(qid)) {
        wrongDims.add(KNOWLEDGE_MAP[qid]);
      }
    });
  });
  
  prepareReinforcementQuestions(wrongDims, wrongDims.size > 0);
}

function refreshCompleteAnalysis(){
  showCompleteAnalysis();
}

function checkReinf(rid, selected, correct, el){
  const parent = el.parentElement;
  parent.querySelectorAll('.reinf-opt').forEach((o,i)=>{
    o.classList.remove('selected','correct-reveal','wrong-reveal');
    if(i===correct) o.classList.add('correct-reveal');
    if(i===selected && selected!==correct) o.classList.add('wrong-reveal');
  });
  el.classList.add(selected===correct?'correct-reveal':'wrong-reveal');
  document.getElementById('ra-'+rid).classList.add('show');
}

function refreshReinf(modIdx){
  // Re-submit to regenerate questions
  submitModule(modIdx);
}

// ===== RADAR CHART =====
function showRadar(){
  const section = document.getElementById('radar-section');
  if(!section) return;
  section.style.display='block';
  section.scrollIntoView({behavior:'smooth'});

  // Calculate scores per dimension
  const scores = DIMS.map(dim=>{
    const qs = DIM_QUESTIONS[dim];
    if(!qs||qs.length===0) return 0;
    let correct=0;
    qs.forEach(qid=>{ if(checkAnswer(qid)) correct++; });
    return Math.round((correct/qs.length)*100);
  });

  const ctx = document.getElementById('radarChart');
  if(!ctx) return;
  new Chart(ctx, {
    type:'radar',
    data:{
      labels:DIMS,
      datasets:[{
        label:'掌握度 %',
        data:scores,
        backgroundColor:'rgba(212,168,83,0.15)',
        borderColor:'rgba(212,168,83,0.8)',
        borderWidth:2,
        pointBackgroundColor:'#d4a853',
        pointBorderColor:'#f0d078',
        pointRadius:5,
        pointHoverRadius:7
      }]
    },
    options:{
      responsive:true,
      scales:{
        r:{
          beginAtZero:true,
          max:100,
          ticks:{stepSize:20,color:'rgba(255,255,255,0.4)',backdropColor:'transparent',font:{size:10}},
          grid:{color:'rgba(255,255,255,0.08)'},
          angleLines:{color:'rgba(255,255,255,0.08)'},
          pointLabels:{color:'rgba(255,255,255,0.75)',font:{size:11,weight:'600'}}
        }
      },
      plugins:{
        legend:{labels:{color:'rgba(255,255,255,0.6)',font:{size:12}}}
      }
    }
  });
}

function getChatReply(msg){

  for(const kw of keywords){
    if(msg.includes(kw)) return CHAT_REPLIES[kw];
  }
  if(msg.includes('错题')||msg.includes('分析')||msg.includes('薄弱')){
    const saved = localStorage.getItem('龙舟赛作业_answers');
    if(!saved) return '🤔 你还没有提交过作业哦！先完成题目，然后我来帮你分析错题和薄弱环节。';
    let wrongList = [];
    const ans = JSON.parse(saved);
    Object.keys(CORRECT).forEach(qid=>{
      if(ans[qid]!==undefined && ans[qid]!==CORRECT[qid]){
        wrongList.push(qid);
      }
    });
    if(wrongList.length===0) return '🎉 太棒了！你目前作答的题目全部正确！继续保持！';
    let reply = '📋 <b>你的错题分析</b><br><br>';
    wrongList.forEach(qid=>{
      const dim = KNOWLEDGE_MAP[qid];
      const exp = QUESTION_EXPLANATIONS[qid];
      if(exp) reply += `❌ <b>${exp.context}</b>（${dim}）<br>${ANSWER_EXP[qid]||''}<br><br>`;
    });
    reply += '💡 建议重点关注薄弱环节，对照课本逐一复习！';
    return reply;
  }
  return `😊 感谢你的提问！这个问题很有趣。<br><br>我目前最擅长回答以下话题：<br>🫁 吸气与呼气过程<br>💪 膈肌、肋间肌运动<br>📏 胸廓变化与胸围差<br>🫧 肺泡与气体交换<br>🌬️ 呼吸道（鼻、咽、喉、气管、支气管）<br>🔧 呼吸模型分析<br>🚨 海姆立克急救法<br>🧘 478呼吸法<br>🐉 龙舟赛与呼吸<br>🏃 运动与呼吸<br>📊 肺活量<br>💨 氧气、二氧化碳、痰<br>📋 错题分析<br><br>试试问我："吸气时膈肌怎么运动？"`;

}

function addBotMsg(html){
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg bot';
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addUserMsg(text){
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg user';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function sendChat(){
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if(!msg) return;
  addUserMsg(msg);
  input.value = '';
  setTimeout(()=>{
    addBotMsg(getChatReply(msg));
  }, 400);
}

// ===== INIT =====
function init(){
  renderModules();
  // Restore from localStorage
  const saved = localStorage.getItem('龙舟赛作业_answers');
  if(saved) answers = JSON.parse(saved);
  const savedC = localStorage.getItem('龙舟赛作业_completed');
  if(savedC){
    moduleCompleted = JSON.parse(savedC);
    moduleCompleted.forEach((done,i)=>{
      if(done) document.querySelectorAll('.nav-btn')[i].classList.add('completed');
    });
  }
  // Restore selections
  Object.keys(answers).forEach(qid=>{
    const val = answers[qid];
    if(typeof val === 'number'){
      const opts = document.getElementById('opts-'+qid);
      if(opts){
        const btns = opts.querySelectorAll('.option-btn');
        if(btns[val]) btns[val].classList.add('selected');
      }
    } else if(typeof val === 'boolean'){
      // Judgment
      const judgeItems = document.querySelectorAll('.judge-item');
      const judgeQids = ['q8_1','q8_2','q8_3','q8_4','q8_5'];
      const idx = judgeQids.indexOf(qid);
      if(idx>=0 && judgeItems[idx]){
        const btns = judgeItems[idx].querySelectorAll('.judge-btn');
        if(val) btns[0].classList.add('selected-true');
        else btns[1].classList.add('selected-false');
      }
    }
  });
}
init();
</script>
